<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a14" />
      <stop offset="50%" stop-color="#0f1325" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <linearGradient id="primaryOrange4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9100" />
      <stop offset="50%" stop-color="#ff6a00" />
      <stop offset="100%" stop-color="#ff3c00" />
    </linearGradient>

    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffea00" />
      <stop offset="50%" stop-color="#ff9100" />
      <stop offset="100%" stop-color="#ff3c00" />
    </linearGradient>

    <filter id="ambientBlur4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <filter id="sunFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="gridPattern4" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#ffffff" fill-opacity="0.06" />
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#bgGrad4)" />
  <rect width="640" height="360" fill="url(#gridPattern4)" />

  <circle cx="200" cy="110" r="120" fill="#ff6a00" fill-opacity="0.25" filter="url(#ambientBlur4)" />
  <circle cx="480" cy="220" r="110" fill="#7928ca" fill-opacity="0.28" filter="url(#ambientBlur4)" />

  <!-- Window Frame -->
  <g transform="translate(100, 35)">
    <rect x="0" y="0" width="440" height="290" rx="18" fill="rgba(16,18,27,0.88)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" />

    <!-- Window Header -->
    <rect x="0" y="0" width="440" height="36" rx="18" fill="#101322" />
    <rect x="0" y="20" width="440" height="16" fill="#101322" />
    <line x1="0" y1="36" x2="440" y2="36" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <circle cx="20" cy="18" r="5" fill="#ff5f56" />
    <circle cx="36" cy="18" r="5" fill="#ffbd2e" />
    <circle cx="52" cy="18" r="5" fill="#27c93f" />

    <rect x="130" y="9" width="180" height="18" rx="9" fill="rgba(255,255,255,0.05)" />
    <text x="220" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#9aa1b2" text-anchor="middle">weather.denilson.dev</text>

    <!-- Weather Main Hero Area -->
    <g transform="translate(30, 55)">
      <!-- Sun & Cloud Illustration -->
      <g transform="translate(30, 35)">
        <circle cx="40" cy="25" r="28" fill="url(#sunGlow)" filter="url(#sunFilter)" />
        <!-- Cloud overlay -->
        <path d="M 25 45 A 18 18 0 0 1 55 30 A 24 24 0 0 1 95 38 A 16 16 0 0 1 92 65 L 25 65 A 15 15 0 0 1 25 45 Z" fill="#1e243a" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
      </g>

      <!-- Info on right of icon -->
      <g transform="translate(150, 15)">
        <!-- Location Pill -->
        <rect x="0" y="0" width="110" height="22" rx="11" fill="rgba(255,106,0,0.12)" stroke="rgba(255,106,0,0.3)" />
        <circle cx="12" cy="11" r="3" fill="#ff6a00" />
        <text x="58" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#ff9100" text-anchor="middle">São Paulo, BR</text>

        <!-- Temperature -->
        <text x="0" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="38" font-weight="800" fill="#ffffff">28°C</text>
        <text x="0" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#9aa1b2">Ensolarado • Máx 31° / Mín 21°</text>
      </g>
    </g>

    <!-- Metric Pills (Humidity, Wind, Rain probability) -->
    <g transform="translate(24, 160)">
      <rect x="0" y="0" width="124" height="48" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
      <text x="14" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#9aa1b2">Umidade</text>
      <text x="14" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff">58%</text>

      <rect x="134" y="0" width="124" height="48" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
      <text x="148" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#9aa1b2">Vento</text>
      <text x="148" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ff9100">14 km/h</text>

      <rect x="268" y="0" width="124" height="48" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
      <text x="282" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#9aa1b2">Chuva</text>
      <text x="282" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#c084fc">0% prob.</text>
    </g>

    <!-- 5-Day Mini Forecast Strip -->
    <g transform="translate(24, 218)">
      <rect x="0" y="0" width="392" height="52" rx="10" fill="rgba(20,24,38,0.6)" stroke="rgba(255,255,255,0.05)" />

      <!-- Mon -->
      <text x="40" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#9aa1b2" text-anchor="middle">SEG</text>
      <circle cx="40" cy="33" r="3.5" fill="#ff9100" />
      <text x="40" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">29°</text>

      <!-- Tue -->
      <text x="118" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#9aa1b2" text-anchor="middle">TER</text>
      <circle cx="118" cy="33" r="3.5" fill="#ff9100" />
      <text x="118" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">30°</text>

      <!-- Wed -->
      <text x="196" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#9aa1b2" text-anchor="middle">QUA</text>
      <circle cx="196" cy="33" r="3.5" fill="#7928ca" />
      <text x="196" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">27°</text>

      <!-- Thu -->
      <text x="274" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#9aa1b2" text-anchor="middle">QUI</text>
      <circle cx="274" cy="33" r="3.5" fill="#ff9100" />
      <text x="274" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">28°</text>

      <!-- Fri -->
      <text x="352" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#9aa1b2" text-anchor="middle">SEX</text>
      <circle cx="352" cy="33" r="3.5" fill="#ff9100" />
      <text x="352" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">31°</text>
    </g>
  </g>

  <!-- Floating Feature Badge -->
  <g transform="translate(480, 290)">
    <rect x="0" y="0" width="120" height="26" rx="13" fill="rgba(255,106,0,0.18)" stroke="rgba(255,106,0,0.4)" stroke-width="1" />
    <text x="60" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#ff9100" text-anchor="middle">☀️ Weather API Live</text>
  </g>
</svg>
